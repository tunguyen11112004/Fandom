{% extends "base.html" %}
{% block title %}Reset password · Fan Hub Plus{% endblock %}
{% block body_class %}stack-manga auth{% endblock %}
{% block content %}
<section class="auth-panel">
  <h1>Forgot password</h1>
  <p>Enter the email on the account. We send a 6-digit OTP there.</p>
  <form method="post">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email" inputmode="email" value="{{ email or '' }}" placeholder="you@example.com" />
    {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
    <button type="submit">Send OTP</button>
  </form>
</section>
{% endblock %}
